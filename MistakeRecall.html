                const descEl = document.getElementById('subjDesc');
                const description = descEl ? descEl.value.trim() : '';
                if (id) {
                    const subj = getSubject(id);
                    if (subj) {
                        subj.name = name;
                        subj.icon = icon;
                        subj.color = color;
                        subj.description = description;
                    }
                } else {
                    data.subjects.push({ id: genId(), name, icon, color, description, createdAt: new Date()
                        .toISOString() });
                }
                saveData();
                closeModal();
                renderAll();
                showToast(id ? 'Subject updated.' : 'Subject created.');
            }

            function deleteSubject(id) {
                if (data.settings.confirmDelete && !confirm(
                        'Delete this subject and ALL its lessons and mistakes? This cannot be undone.')) return;
                const lessonIds = data.lessons.filter(l => l.subjectId === id).map(l => l.id);
                data.mistakes = data.mistakes.filter(m => !lessonIds.includes(m.lessonId) && m.subjectId !== id);
                data.lessons = data.lessons.filter(l => l.subjectId !== id);
                data.subjects = data.subjects.filter(s => s.id !== id);
                data.recallGroups.forEach(g => {
                    g.lessonIds = (g.lessonIds || []).filter(lid => !lessonIds.includes(lid));
                    g.mistakeIds = (g.mistakeIds || []).filter(mid => {
                        const m = getMistake(mid);
                        return m && !lessonIds.includes(m.lessonId);
                    });
                });
                saveData();
                navigateTo('dashboard');
                showToast('Subject deleted.');
            }

            function openLessonModal(subjectId, id = null) {
                const lesson = id ? getLesson(id) : null;
                const isEdit = !!lesson;
                const subjOptions = data.subjects.map(s =>
                    `<option value="${s.id}" ${(lesson?.subjectId||subjectId)===s.id?'selected':''}>${escapeHtml(s.name)}</option>`
                    ).join('');
                showModal(`
            <h3>${isEdit ? 'Edit Lesson' : 'New Lesson'}</h3>
            <div class="form-group">
              <label>Subject</label>
              <select id="lessonSubject">${subjOptions}</select>
            </div>
            <div class="form-group">
              <label>Lesson Name</label>
              <input type="text" id="lessonName" value="${escapeHtml(lesson?.name || '')}" placeholder="e.g., Derivatives, Complex Numbers..." autofocus>
            </div>
            <div class="form-group">
              <label>Note (optional)</label>
              <input type="text" id="lessonNote" value="${escapeHtml(lesson?.note || '')}" placeholder="Optional note...">
            </div>
            <div class="form-actions">
              <button class="btn btn-secondary" onclick="window.MR.closeModal()">Cancel</button>
              <button class="btn btn-primary" onclick="window.MR.saveLesson('${id || ''}')">${isEdit ? 'Save' : 'Create'}</button>
            </div>`);
            }

            function saveLesson(id) {
                const nameEl = document.getElementById('lessonName');
                const name = nameEl ? nameEl.value.trim() : '';
                if (!name) { showToast('Name is required.'); return; }
                const subjectIdEl = document.getElementById('lessonSubject');
                const subjectId = subjectIdEl ? subjectIdEl.value : '';
                const noteEl = document.getElementById('lessonNote');
                const note = noteEl ? noteEl.value.trim() : '';
                if (id) {
                    const lesson = getLesson(id);
                    if (lesson) {
                        lesson.name = name;
                        lesson.subjectId = subjectId;
                        lesson.note = note;
                    }
                } else {
                    data.lessons.push({ id: genId(), subjectId, name, note, createdAt: new Date().toISOString() });
                }
                saveData();
                closeModal();
                renderAll();
                if (state.currentView === 'subjectDetail' && state.currentSubjectId === subjectId) {
                    navigateTo('subjectDetail', { subjectId });
                }
                showToast(id ? 'Lesson updated.' : 'Lesson created.');
            }

            function deleteLesson(id) {
                const lesson = getLesson(id);
                if (!lesson) return;
                if (data.settings.confirmDelete && !confirm(
                        'Delete this lesson and ALL its mistakes? This cannot be undone.')) return;
                data.mistakes = data.mistakes.filter(m => m.lessonId !== id);
                data.lessons = data.lessons.filter(l => l.id !== id);
                data.recallGroups.forEach(g => {
                    g.lessonIds = (g.lessonIds || []).filter(lid => lid !== id);
                });
                saveData();
                navigateTo('subjectDetail', { subjectId: lesson.subjectId });
                showToast('Lesson deleted.');
            }

            function openMistakeModal(subjectId = null, lessonId = null, id = null) {
                const mistake = id ? getMistake(id) : null;
                const isEdit = !!mistake;
                const subjOptions = data.subjects.map(s =>
                    `<option value="${s.id}" ${(mistake?.subjectId||subjectId||'')===s.id?'selected':''}>${escapeHtml(s.name)}</option>`
                    ).join('');
                const selSubjId = mistake?.subjectId || subjectId || (data.subjects[0]?.id || '');
                const lessonOptions = data.lessons.filter(l => l.subjectId === selSubjId).map(l =>
                    `<option value="${l.id}" ${(mistake?.lessonId||lessonId||'')===l.id?'selected':''}>${escapeHtml(l.name)}</option>`
                    ).join('');
                const allTags = ['formula mistake', 'sign mistake', 'method mistake', 'concept mistake', 'carelessness',
                    'exam trap'
                ];
                const currentTags = mistake?.tags || [];
                const tagsCheckboxes = allTags.map(t =>
                    `<label class="checkbox-label"><input type="checkbox" value="${t}" ${currentTags.includes(t)?'checked':''}> ${t}</label>`
                    ).join('');

                window._existingMistakeImage = mistake?.image || null;

                showModal(`
            <h3>${isEdit ? 'Edit Mistake' : 'Fast Add Mistake'}</h3>
            <div class="form-group">
              <label>Subject</label>
              <select id="mistSubject" onchange="window.MR.updateMistLessonOptions()">${subjOptions}</select>
            </div>
            <div class="form-group">
              <label>Lesson</label>
              <select id="mistLesson">${lessonOptions}</select>
            </div>
            <div class="form-group">
              <label>Mistake Title *</label>
              <input type="text" id="mistTitle" value="${escapeHtml(mistake?.title || '')}" placeholder="e.g., Forgot chain rule in composite function" autofocus>
            </div>
            <div class="form-group">
              <label>Short Explanation (optional)</label>
              <textarea id="mistExplanation" placeholder="What went wrong...">${escapeHtml(mistake?.explanation || '')}</textarea>
            </div>
            <div class="form-group">
              <label>Correction / Correct Idea</label>
              <textarea id="mistCorrection" placeholder="The correct approach...">${escapeHtml(mistake?.correction || '')}</textarea>
            </div>
            <div class="form-group">
              <label>Formula / Key Point (optional)</label>
              <input type="text" id="mistFormula" value="${escapeHtml(mistake?.formula || '')}" placeholder="e.g., d/dx[f(g(x))] = f'(g(x))·g'(x)">
            </div>
            <div class="form-group">
              <label>Tags (optional)</label>
              <div class="checkbox-group" id="mistTagsCheckboxes">${tagsCheckboxes}</div>
            </div>
            <div class="form-group">
              <label>Screenshot / Image (optional)</label>
              <input type="file" id="mistImageFile" accept="image/*" style="font-size:0.85rem;">
              <p class="text-muted" style="margin-top:4px;">Or paste an image from clipboard anywhere in this modal.</p>
              ${mistake?.image ? '<p class="text-muted">Current image will be replaced if new one uploaded.</p>' : ''}
            </div>
            <div class="form-actions">
              <button class="btn btn-secondary" onclick="window.MR.closeModal()">Cancel</button>
              <button class="btn btn-primary" id="saveMistakeBtn" onclick="window.MR.saveMistake('${id || ''}')">${isEdit ? 'Save' : 'Add Mistake'}</button>
            </div>`);
            }

            function updateMistLessonOptions() {
                const subjIdEl = document.getElementById('mistSubject');
                const selectEl = document.getElementById('mistLesson');
                if (!selectEl || !subjIdEl) return;
                const subjId = subjIdEl.value;
                const lessons = data.lessons.filter(l => l.subjectId === subjId);
                selectEl.innerHTML = lessons.map(l =>
                    `<option value="${l.id}">${escapeHtml(l.name)}</option>`
                ).join('') || '<option value="">No lessons yet</option>';
            }

            function saveMistake(id) {
                const titleEl = document.getElementById('mistTitle');
                const title = titleEl ? titleEl.value.trim() : '';
                if (!title) { showToast('Title is required.'); return; }
                const subjectIdEl = document.getElementById('mistSubject');
                const subjectId = subjectIdEl ? subjectIdEl.value : '';
                const lessonIdEl = document.getElementById('mistLesson');
                const lessonId = lessonIdEl ? lessonIdEl.value : '';
                const explEl = document.getElementById('mistExplanation');
                const explanation = explEl ? explEl.value.trim() : '';
                const corrEl = document.getElementById('mistCorrection');
                const correction = corrEl ? corrEl.value.trim() : '';
                const formulaEl = document.getElementById('mistFormula');
                const formula = formulaEl ? formulaEl.value.trim() : '';
                const tagCheckboxes = document.querySelectorAll('#mistTagsCheckboxes input:checked');
                const tags = Array.from(tagCheckboxes).map(cb => cb.value);
                const imageFileEl = document.getElementById('mistImageFile');
                const imageFile = imageFileEl ? imageFileEl.files?.[0] : null;

                function finalizeSave(imageData) {
                    if (id) {
                        const mistake = getMistake(id);
                        if (mistake) {
                            mistake.title = title;
                            mistake.subjectId = subjectId;
                            mistake.lessonId = lessonId;
                            mistake.explanation = explanation;
                            mistake.correction = correction;
                            mistake.formula = formula;
                            mistake.tags = tags;
                            if (imageData !== undefined) mistake.image = imageData;
                        }
                    } else {
                        data.mistakes.push({
                            id: genId(),
                            subjectId,
                            lessonId,
                            title,
                            explanation,
                            correction,
                            formula,
                            tags,
                            image: imageData || null,
                            pinned: false,
                            dateAdded: new Date().toISOString(),
                            archived: false,
                        });
                    }
                    saveData();
                    closeModal();
                    renderAll();
                    if (state.currentView === 'lessonDetail' && state.currentLessonId === lessonId) {
                        navigateTo('lessonDetail', { lessonId, subjectId });
                    } else if (state.currentView === 'subjectDetail' && state.currentSubjectId === subjectId) {
                        navigateTo('subjectDetail', { subjectId });
                    }
                    showToast(id ? 'Mistake updated.' : 'Mistake added!');
                }

                if (imageFile) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        finalizeSave(e.target.result);
                    };
                    reader.readAsDataURL(imageFile);
                } else if (window._existingMistakeImage && !imageFile) {
                    finalizeSave(window._existingMistakeImage);
                } else {
                    finalizeSave(id ? (getMistake(id)?.image || null) : null);
                }
                window._existingMistakeImage = null;
            }

            function duplicateMistake(id) {
                const orig = getMistake(id);
                if (!orig) return;
                const copy = {
                    ...orig,
                    id: genId(),
                    title: orig.title + ' (copy)',
                    dateAdded: new Date().toISOString(),
                    pinned: false,
                };
                data.mistakes.push(copy);
                saveData();
                renderAll();
                showToast('Mistake duplicated.');
            }

            function deleteMistake(id) {
                const mistake = getMistake(id);
                if (!mistake) return;
                if (data.settings.confirmDelete && !confirm('Delete this mistake?')) return;
                data.mistakes = data.mistakes.filter(m => m.id !== id);
                data.recallGroups.forEach(g => {
                    g.mistakeIds = (g.mistakeIds || []).filter(mid => mid !== id);
                });
                saveData();
                renderAll();
                showToast('Mistake deleted.');
            }

            function togglePin(id) {
                const mistake = getMistake(id);
                if (!mistake) return;
                mistake.pinned = !mistake.pinned;
                saveData();
                renderAll();
                showToast(mistake.pinned ? 'Pinned 📌' : 'Unpinned');
            }

            function openGroupModal(id = null) {
                const group = id ? getGroup(id) : null;
                const isEdit = !!group;
                const allLessons = data.lessons;
                const selectedLessonIds = group?.lessonIds || [];
                const grpColor = group?.color || '#a855f7';

                const lessonCheckboxes = allLessons.map(l => {
                    const subj = getSubject(l.subjectId);
                    return `
                <label class="checkbox-label">
                  <input type="checkbox" value="${l.id}" class="grp-lesson-cb" ${selectedLessonIds.includes(l.id)?'checked':''}>
                  <span style="color:${subj?.color||'var(--accent)'};">${escapeHtml(subj?.name||'?')}</span> → ${escapeHtml(l.name)}
                </label>`;
                }).join('');

                showModal(`
            <h3>${isEdit ? 'Edit Recall Group' : 'New Recall Group'}</h3>
            <div class="form-group">
              <label>Group Name</label>
              <input type="text" id="grpName" value="${escapeHtml(group?.name || '')}" placeholder="e.g., BAC Geometry Bundle" autofocus>
            </div>
            <div class="form-group">
              <label>Color</label>
              <div class="color-options" id="grpColorOptions">
                ${['#a855f7','#5b9bff','#4caf84','#e0a955','#e0556a','#f97316'].map(c => `
                  <span class="color-dot ${grpColor===c?'selected':''}" style="background:${c};" data-color="${c}" onclick="window.MR.selectGrpColor('${c}')"></span>
                `).join('')}
              </div>
              <input type="hidden" id="grpColor" value="${grpColor}">
            </div>
            <div class="form-group">
              <label>Select Lessons to Include</label>
              <div class="checkbox-group" style="max-height:200px;overflow-y:auto;">
                ${lessonCheckboxes || '<p class="text-muted">No lessons available. Create lessons first.</p>'}
              </div>
            </div>
            <div class="form-actions">
              <button class="btn btn-secondary" onclick="window.MR.closeModal()">Cancel</button>
              <button class="btn btn-primary" onclick="window.MR.saveGroup('${id || ''}')">${isEdit ? 'Save' : 'Create Group'}</button>
            </div>`);
            }

            function selectGrpColor(c) {
                document.getElementById('grpColor').value = c;
                document.querySelectorAll('#grpColorOptions .color-dot').forEach(d => d.classList.remove('selected'));
                const dot = document.querySelector(`#grpColorOptions .color-dot[data-color="${c}"]`);
                if (dot) dot.classList.add('selected');
            }

            function saveGroup(id) {
                const nameEl = document.getElementById('grpName');
                const name = nameEl ? nameEl.value.trim() : '';
                if (!name) { showToast('Name is required.'); return; }
                const colorEl = document.getElementById('grpColor');
                const color = (colorEl ? colorEl.value : '') || '#a855f7';
                const lessonCbs = document.querySelectorAll('.grp-lesson-cb:checked');
                const lessonIds = Array.from(lessonCbs).map(cb => cb.value);
                if (id) {
                    const group = getGroup(id);
                    if (group) {
                        group.name = name;
                        group.color = color;
                        group.lessonIds = lessonIds;
                    }
                } else {
                    data.recallGroups.push({
                        id: genId(),
                        name,
                        color,
                        lessonIds,
                        mistakeIds: [],
                        createdAt: new Date().toISOString(),
                    });
                }
                saveData();
                closeModal();
                renderAll();
                showToast(id ? 'Group updated.' : 'Group created.');
            }

            function deleteGroup(id) {
                if (data.settings.confirmDelete && !confirm('Delete this recall group?')) return;
                data.recallGroups = data.recallGroups.filter(g => g.id !== id);
                saveData();
                navigateTo('recallGroups');
                showToast('Group deleted.');
            }

            // ────────────────────────────────────
            // SEARCH STATE HELPERS
            // ────────────────────────────────────
            function handleSearchInput(value) {
                state.searchQuery = value;
                navigateTo('search', {
                    query: value,
                    filterSubject: state.filterSubject,
                    filterLesson: state.filterLesson,
                    filterGroup: state.filterGroup,
                });
            }

            function getSearchQuery() { return state.searchQuery; }

            function getFilterSubject() { return state.filterSubject; }

            function getFilterGroup() { return state.filterGroup; }

            // ────────────────────────────────────
            // SETTINGS ACTIONS
            // ────────────────────────────────────
            function toggleDarkMode() {
                data.settings.darkMode = !data.settings.darkMode;
                saveData();
                applySettings();
                showToast(data.settings.darkMode ? 'Dark mode ON' : 'Light mode ON');
            }

            function setAccentColor(color) {
                data.settings.accentColor = color;
                saveData();
                applySettings();
                renderAll();
                showToast('Accent color updated.');
            }

            function exportData() {
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'mistakes-recall-backup-' + new Date().toISOString().slice(0, 10) + '.json';
                a.click();
                URL.revokeObjectURL(url);
                showToast('Backup exported!');
            }

            function importData(event) {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const imported = JSON.parse(e.target.result);
                        if (imported.subjects && imported.lessons && imported.mistakes && imported.recallGroups) {
                            if (data.settings.confirmDelete && data.mistakes.length > 0 && !confirm(
                                    'Importing will REPLACE all current data. Continue?')) return;
                            data = {
                                subjects: imported.subjects,
                                lessons: imported.lessons,
                                mistakes: imported.mistakes,
                                recallGroups: imported.recallGroups,
                                settings: imported.settings || data.settings,
                            };
                            saveData();
                            applySettings();
                            navigateTo('dashboard');
                            showToast('Data imported successfully!');
                        } else {
                            showToast('Invalid backup file.');
                        }
                    } catch (err) {
                        showToast('Error importing file.');
                    }
                };
                reader.readAsText(file);
                event.target.value = '';
            }

            function clearAllData() {
                if (!confirm(
                        'Delete ALL data? This includes all subjects, lessons, mistakes, and recall groups. This cannot be undone.'
                        )) return;
                if (!confirm('Are you absolutely sure? This action is irreversible.')) return;
                data = JSON.parse(JSON.stringify(DEFAULT_DATA));
                saveData();
                applySettings();
                navigateTo('dashboard');
                showToast('All data cleared.');
            }

            // ────────────────────────────────────
            // SIDEBAR TOGGLE (MOBILE)
            // ────────────────────────────────────
            function toggleSidebar() {
                state.sidebarOpen = !state.sidebarOpen;
                const sidebar = document.getElementById('sidebar');
                if (sidebar) {
                    if (state.sidebarOpen) {
                        sidebar.classList.add('open');
                    } else {
                        sidebar.classList.remove('open');
                    }
                }
            }

            // ────────────────────────────────────
            // EXPOSE PUBLIC API VIA window.MR
            // ────────────────────────────────────
            const MR = {
                navigateTo,
                startReview,
                startReviewByIds,
                closeReview,
                nextCard,
                prevCard,
                toggleShuffleReview,
                jumpToCard,
                openSubjectModal,
                openLessonModal,
                openMistakeModal,
                openGroupModal,
                closeModal,
                saveSubject,
                saveLesson,
                saveMistake,
                saveGroup,
                deleteSubject,
                deleteLesson,
                deleteMistake,
                deleteGroup,
                togglePin,
                duplicateMistake,
                handleSearchInput,
                toggleDarkMode,
                setAccentColor,
                exportData,
                importData,
                clearAllData,
                toggleSidebar,
                updateMistLessonOptions,
                selectSubjColor,
                selectGrpColor,
                getAllMistakes: getAllMistakes,
                getPinnedMistakes: getPinnedMistakes,
                getMistakesBySubjectId: getMistakesBySubject,
                getMistakesByLessonId: getMistakesByLesson,
                getMistakesByGroupId: getMistakesByGroup,
                getSearchQuery,
                getFilterSubject,
                getFilterGroup,
            };

            window.MR = MR;

            // ────────────────────────────────────
            // GLOBAL KEYBOARD SHORTCUTS
            // ────────────────────────────────────
            document.addEventListener('keydown', function(e) {
                const tag = document.activeElement?.tagName?.toLowerCase();
                const isInput = tag === 'input' || tag === 'textarea' || tag === 'select' || document.activeElement
                    ?.isContentEditable;

                if (state.currentView === 'review') {
                    if (e.key === 'ArrowRight' && !isInput) {
                        e.preventDefault();
                        nextCard();
                    } else if (e.key === 'ArrowLeft' && !isInput) {
                        e.preventDefault();
                        prevCard();
                    } else if (e.key === 's' && !isInput && !e.ctrlKey && !e.metaKey) {
                        e.preventDefault();
                        toggleShuffleReview();
                    } else if (e.key === 'Escape') {
                        e.preventDefault();
                        closeReview();
                    }
                } else {
                    if (e.key === 'n' && !isInput && !e.ctrlKey && !e.metaKey && !e.altKey) {
                        const modalContainer = document.getElementById('modalContainer');
                        if (!modalContainer || !modalContainer.innerHTML.trim()) {
                            e.preventDefault();
                            openMistakeModal();
                        }
                    } else if (e.key === 'Escape') {
                        const modalContainer = document.getElementById('modalContainer');
                        if (modalContainer && modalContainer.innerHTML.trim()) {
                            e.preventDefault();
                            closeModal();
                        }
                    }
                }
            });

            // Close sidebar when clicking outside on mobile
            document.addEventListener('click', function(e) {
                if (window.innerWidth <= 768 && state.sidebarOpen) {
                    const sidebar = document.getElementById('sidebar');
                    const menuBtn = document.querySelector('.menu-btn');
                    if (sidebar && !sidebar.contains(e.target) && menuBtn && !menuBtn.contains(e.target)) {
                        state.sidebarOpen = false;
                        sidebar.classList.remove('open');
                    }
                }
            });

            // ────────────────────────────────────
            // PASTE IMAGE SUPPORT
            // ────────────────────────────────────
            document.addEventListener('paste', function(e) {
                const modalContainer = document.getElementById('modalContainer');
                if (!modalContainer || !modalContainer.innerHTML.trim()) return;
                const items = e.clipboardData?.items;
                if (!items) return;
                for (const item of items) {
                    if (item.type.startsWith('image/')) {
                        e.preventDefault();
                        const blob = item.getAsFile();
                        const reader = new FileReader();
                        reader.onload = function(ev) {
                            window._existingMistakeImage = ev.target.result;
                            showToast('Image pasted! Save the mistake to keep it.');
                        };
                        reader.readAsDataURL(blob);
                        break;
                    }
                }
            });

            // ────────────────────────────────────
            // INIT
            // ────────────────────────────────────
            renderAll();
            console.log('📝 Mistakes Recall — Ready');
            console.log('Shortcuts: N = Fast Add | ←→ = Navigate cards | S = Shuffle | Esc = Close');
            console.log(
                `Loaded: ${data.mistakes.length} mistakes, ${data.subjects.length} subjects, ${data.lessons.length} lessons, ${data.recallGroups.length} groups`
                );
        })();
    </script>
</body>
</html>
